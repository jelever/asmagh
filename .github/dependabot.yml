# Dependabot opens pull requests for dependency and security updates. The
# Pages workflow builds and checks each one; merge during the monthly routine
# (railway/README.md). Adapted from railway/templates/dependabot.yml for a
# static Eleventy site: npm and GitHub Actions only.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      eleventy:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
